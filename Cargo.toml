[package]
name = "aip_filter"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
serde_json = "1"
rand = "0.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "aip-filter"
path = "src/main.rs"
