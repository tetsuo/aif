[package]
name = "ele"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "AIP-160-style filtering for Rust values and newline-delimited JSON"
repository = "https://github.com/tetsuo/ele"
documentation = "https://docs.rs/ele"
readme = "README.md"
keywords = ["aip-160", "filter", "json", "cli"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
regex = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "ele"
path = "src/main.rs"
